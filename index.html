<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Moffat Radar Scope</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #06090e; color: #00ffcc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #header {
      width: 100%; height: 48px; background: #0b1118;
      border-bottom: 2px solid #00ffcc33; padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 1000;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 1.05rem; font-weight: 700; color: #00ffcc; letter-spacing: 1.2px; text-transform: uppercase; }
    .badge {
      background: rgba(0, 255, 204, 0.1); border: 1px solid #00ffcc66;
      border-radius: 4px; padding: 2px 6px; font-size: 0.7rem; color: #00ffcc;
    }
    .stats { display: flex; gap: 14px; font-size: 0.75rem; }
    .stat-item { display: flex; flex-direction: column; align-items: flex-end; }
    .stat-label { color: #627d98; font-size: 0.6rem; text-transform: uppercase; }
    .stat-val { color: #f0f4f8; font-weight: 600; }
    #main-container {
      width: 100%; height: calc(100vh - 48px);
      display: flex; flex-direction: column; position: relative;
    }
    @media (min-width: 768px) { #main-container { flex-direction: row; } }
    #map { flex: 1; width: 100%; height: 55%; background: #05080c; }
    @media (min-width: 768px) { #map { height: 100%; } }
    #sidebar {
      width: 100%; height: 45%; background: #0b1118ee;
      border-top: 1px solid #00ffcc22; display: flex; flex-direction: column; z-index: 1000;
    }
    @media (min-width: 768px) {
      #sidebar { width: 320px; height: 100%; border-top: none; border-left: 1px solid #00ffcc22; }
    }
    .sidebar-header {
      height: 38px; padding: 0 14px; border-bottom: 1px solid #00ffcc22;
      font-size: 0.8rem; font-weight: 600; color: #9fb3c8;
      text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    #traffic-list { flex: 1; overflow-y: auto; padding: 8px; }
    .traffic-card {
      background: #101822; border: 1px solid #1f2d3d; border-radius: 4px;
      padding: 8px 10px; margin-bottom: 6px; cursor: pointer; transition: all 0.2s ease;
    }
    .traffic-card:hover { border-color: #00ffcc66; background: #14202e; }
    .traffic-card.selected { border-color: #00ffcc; background: #142636; }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .card-callsign { font-size: 0.9rem; font-weight: 600; color: #f0f4f8; }
    .card-alt { font-size: 0.78rem; color: #00ffcc; }
    .card-details { display: grid; grid-template-columns: 1fr 1fr; font-size: 0.7rem; color: #829ab1; row-gap: 2px; }
    .station-marker {
      width: 14px; height: 14px; background: #00ffcc;
      border: 2px solid #ffffff; border-radius: 50%; box-shadow: 0 0 15px #00ffcc;
    }
    .custom-plane-icon { display: flex; align-items: center; justify-content: center; }
    .leaflet-popup-content-wrapper {
      background: #0b1118ee; color: #f0f4f8;
      border: 1px solid #00ffcc66; border-radius: 6px;
    }
    .leaflet-popup-tip { background: #0b1118ee; }
  </style>
</head>
<body>

  <div id="header">
    <div class="brand">
      <h1>Moffat Scope</h1>
      <span class="badge">DG10 RADAR</span>
    </div>
    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">Coverage</span>
        <span class="stat-val">50 NM</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Tracked</span>
        <span class="stat-val" id="target-count">0</span>
      </div>
    </div>
  </div>

  <div id="main-container">
    <div id="map"></div>
    <div id="sidebar">
      <div class="sidebar-header">
        <span>Air Traffic Feed</span>
        <span id="feed-status" style="color: #00ffcc;">INITIALIZING...</span>
      </div>
      <div id="traffic-list"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <script>
    var MOFFAT_LAT = 55.332;
    var MOFFAT_LON = -3.444;

    var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([MOFFAT_LAT, MOFFAT_LON], 9);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16
    }).addTo(map);

    setTimeout(function() { map.invalidateSize(); }, 250);
    window.addEventListener('resize', function() { map.invalidateSize(); });

    var stationIcon = L.divIcon({
      className: '',
      html: '<div class="station-marker"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });
    L.marker([MOFFAT_LAT, MOFFAT_LON], { icon: stationIcon })
      .bindTooltip("MOFFAT RADAR", { permanent: false, direction: 'top' })
      .addTo(map);

    var nmToMeters = 1852;
    [10, 25, 50].forEach(function(range) {
      L.circle([MOFFAT_LAT, MOFFAT_LON], {
        radius: range * nmToMeters,
        color: '#00ffcc',
        weight: 1,
        dashArray: '4, 8',
        fill: false,
        opacity: 0.25
      }).addTo(map);
    });

    var aircraftMarkers = {};
    var aircraftData = [];
    var selectedHex = null;

    function getAltColor(alt) {
      if (alt < 10000) return '#00ff88';
      if (alt < 25000) return '#00d0ff';
      if (alt < 36000) return '#ffaa00';
      return '#ff3366';
    }

    function createPlaneIcon(heading, alt) {
      var color = getAltColor(alt);
      var svg = '<svg width="24" height="24" viewBox="0 0 24 24" style="transform: rotate(' + heading + 'deg);"><path fill="' + color + '" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>';
      return L.divIcon({
        className: 'custom-plane-icon',
        html: svg,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      var R = 3440.065;
      var dLat = (lat2 - lat1) * Math.PI / 180;
      var dLon = (lon2 - lon1) * Math.PI / 180;
      var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
      var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return (R * c).toFixed(1);
    }

    async function fetchTraffic() {
      var lamin = (MOFFAT_LAT - 0.83).toFixed(4);
      var lamax = (MOFFAT_LAT + 0.83).toFixed(4);
      var lomin = (MOFFAT_LON - 1.45).toFixed(4);
      var lomax = (MOFFAT_LON + 1.45).toFixed(4);

      var openSkyTarget = "https://opensky-network.org/api/states/all?lamin=" + lamin + "&lomin=" + lomin + "&lamax=" + lamax + "&lomax=" + lomax;

      // Proxies that strip CORS restrictions so GitHub Pages can read the response
      var proxies = [
        "https://corsproxy.io/?" + encodeURIComponent(openSkyTarget),
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(openSkyTarget)
      ];

      var traffic = [];

      for (var i = 0; i < proxies.length; i++) {
        try {
          var controller = new AbortController();
          var timeoutId = setTimeout(function() { controller.abort(); }, 5000);

          var res = await fetch(proxies[i], { signal: controller.signal });
          clearTimeout(timeoutId);

          if (res.ok) {
            var data = await res.json();
            if (data && data.states && data.states.length > 0) {
              traffic = data.states.map(function(s) {
                var altFeet = s[7] ? Math.round(s[7] * 3.28084) : (s[13] ? Math.round(s[13] * 3.28084) : 0);
                var speedKts = s[9] ? Math.round(s[9] * 1.94384) : 0;
                var heading = s[10] ? Math.round(s[10]) : 0;
                var lat = s[6];
                var lon = s[5];

                return {
                  hex: s[0],
                  callsign: (s[1] || s[0]).trim(),
                  lat: lat,
                  lon: lon,
                  alt: altFeet,
                  speed: speedKts,
                  track: heading,
                  dist: calculateDistance(MOFFAT_LAT, MOFFAT_LON, lat, lon)
                };
              }).filter(function(a) { return a.lat && a.lon; });

              document.getElementById('feed-status').textContent = 'LIVE (OPENSKY)';
              break;
            }
          }
        } catch (e) {
          console.warn("Proxy attempt failed, trying next...", e);
        }
      }

      if (traffic.length === 0) {
        document.getElementById('feed-status').textContent = 'SCANNING SKY...';
      }

      updateMapAndSidebar(traffic);
    }

    function updateMapAndSidebar(traffic) {
      document.getElementById('target-count').textContent = traffic.length;
      var listEl = document.getElementById('traffic-list');
      listEl.innerHTML = '';

      var currentHexes = new Set();

      traffic.forEach(function(ac) {
        currentHexes.add(ac.hex);

        if (!aircraftMarkers[ac.hex]) {
          var marker = L.marker([ac.lat, ac.lon], {
            icon: createPlaneIcon(ac.track, ac.alt)
          }).addTo(map);

          marker.on('click', function() { selectAircraft(ac.hex); });
          aircraftMarkers[ac.hex] = marker;
        } else {
          aircraftMarkers[ac.hex].setLatLng([ac.lat, ac.lon]);
          aircraftMarkers[ac.hex].setIcon(createPlaneIcon(ac.track, ac.alt));
        }

        var popupHtml = '<div style="font-size:0.85rem; line-height: 1.4;">' +
          '<b style="color:#00ffcc; font-size:1rem;">' + ac.callsign + '</b><br>' +
          '<b>Altitude:</b> ' + ac.alt.toLocaleString() + ' ft<br>' +
          '<b>Speed:</b> ' + ac.speed + ' kts<br>' +
          '<b>Track:</b> ' + ac.track + '&deg;<br>' +
          '<b>Distance:</b> ' + ac.dist + ' NM' +
          '</div>';
        aircraftMarkers[ac.hex].bindPopup(popupHtml);

        var card = document.createElement('div');
        card.className = 'traffic-card' + (selectedHex === ac.hex ? ' selected' : '');
        card.onclick = function() { selectAircraft(ac.hex); };
        card.innerHTML = '<div class="card-top">' +
          '<span class="card-callsign">' + ac.callsign + '</span>' +
          '<span class="card-alt" style="color:' + getAltColor(ac.alt) + '">' + ac.alt.toLocaleString() + ' FT</span>' +
          '</div>' +
          '<div class="card-details">' +
          '<span>GS: ' + ac.speed + ' KT</span>' +
          '<span>HDG: ' + ac.track + '&deg;</span>' +
          '<span>DIST: ' + ac.dist + ' NM</span>' +
          '</div>';
        listEl.appendChild(card);
      });

      Object.keys(aircraftMarkers).forEach(function(hex) {
        if (!currentHexes.has(hex)) {
          map.removeLayer(aircraftMarkers[hex]);
          delete aircraftMarkers[hex];
        }
      });

      aircraftData = traffic;
    }

    function selectAircraft(hex) {
      selectedHex = hex;
      var target = aircraftData.find(function(a) { return a.hex === hex; });
      if (target && aircraftMarkers[hex]) {
        map.flyTo([target.lat, target.lon], 10, { animate: true, duration: 1 });
        aircraftMarkers[hex].openPopup();
      }
      var cards = document.querySelectorAll('.traffic-card');
      cards.forEach(function(c) { c.classList.remove('selected'); });
    }

    fetchTraffic();
    setInterval(fetchTraffic, 10000);
  </script>
</body>
</html>
