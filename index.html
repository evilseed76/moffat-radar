<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moffat Radar Scope | DG10</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #06090e;
      color: #00ffcc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    #header {
      width: 100%;
      height: 50px;
      background: #0b1118;
      border-bottom: 2px solid rgba(0, 255, 204, 0.25);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .radar-pulse {
      width: 10px;
      height: 10px;
      background: #00ffcc;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ffcc;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 16px #00ffcc; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    .brand h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #00ffcc;
    }

    .badge {
      background: rgba(0, 255, 204, 0.1);
      border: 1px solid rgba(0, 255, 204, 0.4);
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 0.7rem;
      color: #00ffcc;
      letter-spacing: 0.5px;
    }

    .stats {
      display: flex;
      gap: 18px;
      font-size: 0.75rem;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .stat-label {
      color: #627d98;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-val {
      color: #f0f4f8;
      font-weight: 600;
    }

    #radar-container {
      width: 100%;
      height: calc(100vh - 50px);
      position: relative;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>

  <header id="header">
    <div class="brand">
      <div class="radar-pulse"></div>
      <h1>Moffat Scope</h1>
      <span class="badge">DG10 RADAR</span>
    </div>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-label">Coverage Sector</span>
        <span class="stat-val">55.33°N / -3.44°W</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Feed Status</span>
        <span class="stat-val" style="color: #00ffcc;">LIVE (AVIOADSB)</span>
      </div>
    </div>
  </header>

  <main id="radar-container">
    <iframe 
      src="https://avioadsb.org/embed/map?lat=55.33&amp;lon=-3.44&amp;zoom=8&amp;accent=00fbff&amp;theme=dark&amp;sidebar=1&amp;controls=1"
      title="Live flight tracker map by AvioADSB" 
      loading="lazy" 
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>

</body>
</html>
